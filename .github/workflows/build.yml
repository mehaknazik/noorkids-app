name: Build Android APK and Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Assets
      run: npm run build

    - name: Setup Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android || true
        sed -i 's|</application>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n</application>|' android/app/src/main/AndroidManifest.xml || true

    - name: Build Android APK and Bundle
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug -x lint -x test --no-daemon
        ./gradlew bundle -x lint -x test --no-daemon || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoorKids-APK
        path: android/app/build/outputs/**/*.apk

    - name: Upload Play Store AAB
      uses: actions/upload-artifact@v4
      with:
        name: NoorKids-PlayStore-AAB
        path: android/app/build/outputs/**/*.aab
        if-no-files-found: ignore
