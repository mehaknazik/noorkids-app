name: Build Android APK and Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Assets
      run: npm run build

    - name: Setup Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android || true
        sed -i 's|</application>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n</application>|' android/app/src/main/AndroidManifest.xml || true

    - name: Build Android APK & AAB
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        ./gradlew bundleRelease --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NoorKids-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Play Store AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: NoorKids-PlayStore-Bundle
        path: android/app/build/outputs/bundle/release/app-release.aab
